name: release-wasm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Promote exact protected-head qualification custody; readback is effect-free
        type: choice
        options: [readback, promote, recovery, inspect]
        default: readback
      executor:
        description: Exact root-accepted protected executor E
        required: true
        type: string
      reviewed_tuple:
        description: Root-reviewed protected qualification run/attempt/artifact/digest tuple
        required: true
        type: string
      first_promotion_run:
        description: Original promotion run for interrupted tag-before-draft recovery
        required: false
        type: string

      first_promotion_attempt:
        description: Exact original attempt for interrupted tag-before-draft recovery
        required: false
        type: string

concurrency:
  group: release-wasm-current
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACCEPTED_EXECUTOR: ${{ inputs.executor }}
  REVIEWED_TUPLE: ${{ inputs.reviewed_tuple }}
  FIRST_PROMOTION_RUN: ${{ inputs.first_promotion_run }}
  FIRST_PROMOTION_ATTEMPT: ${{ inputs.first_promotion_attempt }}
  NUGET_ACCOUNT: ${{ secrets.NUGET_USER || 'Paradigma11' }}
  DOTNET_PROCESSOR_COUNT: 1
  MSBUILDDISABLENODEREUSE: 1
  UseSharedCompilation: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind protected executor and source-only operation
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$ACCEPTED_EXECUTOR" ]]
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_EXECUTOR" && -z "$(git status --porcelain)" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$ACCEPTED_EXECUTOR" ]]
          [[ -n "$REVIEWED_TUPLE" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          if [[ "$MODE" == promote ]]; then [[ -z "$FIRST_PROMOTION_RUN" && -z "$FIRST_PROMOTION_ATTEMPT" ]]; fi
          [[ "$GITHUB_WORKFLOW_SHA" == "$ACCEPTED_EXECUTOR" ]]
          bash tests/release/wasm/test-release-wasm.sh --source-only

  admission:
    name: admission [org-publication-writer]
    needs: [preflight]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery' || inputs.mode == 'readback'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: trust
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Authenticate and admit exact prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          NUGET_EXCHANGE_VERIFIED: ${{ steps.trust.outputs.NUGET_API_KEY != '' && 'true' || 'false' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          args=(); [[ "$MODE" == promote ]] || args=(--recovery)
          mkdir "$RUNNER_TEMP/admission"
          python3 scripts/wasm-release/promotion.py admit --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/admission/admission-binding.json" "${args[@]}"
      - name: Retain successful native admission
        uses: actions/upload-artifact@v7
        with:
          name: wasm-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission/admission-binding.json
          if-no-files-found: error
          retention-days: 90

  begin:
    name: begin [org-publication-writer]
    needs: [admission]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Create bound draft
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          args=(); [[ "$MODE" == promote ]] || args=(--recovery)
          python3 scripts/wasm-release/promotion.py begin --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" "${args[@]}"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-begin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  org:
    name: org [org-publication-writer]
    needs: [begin]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Execute org from exact originals
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          python3 scripts/wasm-release/promotion.py org --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/readback"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-org-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  public:
    name: public [org-publication-writer]
    needs: [org]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Execute public from exact originals
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          python3 scripts/wasm-release/promotion.py public --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/readback"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  assets:
    name: assets [org-publication-writer]
    needs: [public]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
      contents: write
      packages: read
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Execute assets from exact originals
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          python3 scripts/wasm-release/promotion.py assets --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/readback"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  complete:
    name: complete [org-publication-writer]
    needs: [org, public, assets]
    if: inputs.mode == 'promote' || inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      checks: read
      contents: write
      packages: read
    steps:
      - name: Acquire org publication writer lock
        uses: FS-GG/.github/.github/actions/publication-writer-lock@c799a9f9b21d52eb9766cf0950722e3e55145d39 # ADR-0097
        with:
          max-wait-minutes: 30
        timeout-minutes: 32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Execute complete from exact originals
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          python3 scripts/wasm-release/promotion.py complete --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/readback"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  readback:
    needs: [admission]
    if: inputs.mode == 'readback'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Execute readback from exact originals
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TOKEN: ${{ github.token }}
          TAG_CREDENTIAL_ROUTE: workflow-github-token
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readback"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/readback/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B -c 'import importlib.util,json,pathlib; s=importlib.util.spec_from_file_location("p","scripts/wasm-release/promotion.py"); p=importlib.util.module_from_spec(s); s.loader.exec_module(p); p.download(p.Native(),p.load(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"reviewed.json"),pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"custody")'
          python3 scripts/wasm-release/promotion.py readback --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/readback"
      - name: Retain actual transaction receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-promotion-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          if-no-files-found: ignore
          retention-days: 90

  inspect:
    needs: [preflight]
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Inspect exact bound draft without release effects
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: inspect
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/inspection"
          export WASM_API_RECEIPTS="$RUNNER_TEMP/inspection/native-api-status.jsonl"
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed.json").write_text(os.environ["REVIEWED_TUPLE"])'
          python3 -B scripts/wasm-release/promotion.py inspect --reviewed "$RUNNER_TEMP/reviewed.json" --custody "$RUNNER_TEMP/custody" --output "$RUNNER_TEMP/inspection/inspection-binding.json"
      - name: Retain read-only inspection observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspection/
          if-no-files-found: error
          retention-days: 90
