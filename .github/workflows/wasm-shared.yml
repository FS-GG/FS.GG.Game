name: wasm-shared

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasm-shared.yml"
      - ".github/workflows/release-wasm.yml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "Directory.Build.*"
      - "src/Wasm.Contracts/**"
      - "src/Wasm.Browser/**"
      - "tests/Wasm.Contracts.Tests/**"
      - "tests/Wasm.Contracts.PortableConsumers/**"
      - "tests/Wasm.Compatibility/**"
      - "tests/Wasm.Invocation.Tests/**"
      - "tests/Wasm.Lifecycle.Tests/**"
      - "tests/Wasm.Lifecycle.Correspondence/**"
      - "tests/Wasm.Browser.Conformance/**"
      - "tests/Wasm.PackageConsumer/**"
      - "tests/Wasm.Supervisor.Compatibility/**"
      - "eng/wasm-shared/**"
      - "sdk/wasm/**"
      - "examples/wasm/**"
      - "docs/wasm/**"
      - "scripts/verify-wasm-contracts.sh"
      - "scripts/verify-wasm-lifecycle.sh"
      - "scripts/verify-wasm-workflow.sh"
      - "scripts/prepare-wasm-traces.sh"
      - "scripts/prepare-wasm-traces.py"
      - "scripts/verify-wasm-package-consumer.sh"
      - "scripts/verify-wasm-supervisor.sh"
      - "scripts/verify-wasm-supervisor-browser.sh"
      - "scripts/wasm-release/**"
      - "tests/release/wasm/**"
      - "eng/wasm-shared/version.props"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wasm-shared.yml"
      - ".github/workflows/release-wasm.yml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "Directory.Build.*"
      - "src/Wasm.Contracts/**"
      - "src/Wasm.Browser/**"
      - "tests/Wasm.Contracts.Tests/**"
      - "tests/Wasm.Contracts.PortableConsumers/**"
      - "tests/Wasm.Compatibility/**"
      - "tests/Wasm.Invocation.Tests/**"
      - "tests/Wasm.Lifecycle.Tests/**"
      - "tests/Wasm.Lifecycle.Correspondence/**"
      - "tests/Wasm.Browser.Conformance/**"
      - "tests/Wasm.PackageConsumer/**"
      - "tests/Wasm.Supervisor.Compatibility/**"
      - "eng/wasm-shared/**"
      - "sdk/wasm/**"
      - "examples/wasm/**"
      - "docs/wasm/**"
      - "scripts/verify-wasm-contracts.sh"
      - "scripts/verify-wasm-lifecycle.sh"
      - "scripts/verify-wasm-workflow.sh"
      - "scripts/prepare-wasm-traces.sh"
      - "scripts/prepare-wasm-traces.py"
      - "scripts/verify-wasm-package-consumer.sh"
      - "scripts/verify-wasm-supervisor.sh"
      - "scripts/verify-wasm-supervisor-browser.sh"
      - "scripts/wasm-release/**"
      - "tests/release/wasm/**"
      - "eng/wasm-shared/version.props"
  workflow_dispatch:
    inputs:
      mode:
        description: Full qualification or explicit trace artifact preparation
        type: choice
        options: [qualify, generate-traces]
        default: qualify
        required: true
      expected-head:
        description: Exact reviewed 40-hex workflow/source head for generate-traces
        type: string
        default: ""
        required: false

concurrency:
  group: wasm-shared-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode == 'generate-traces' && 'generate-traces' || 'qualify' }}
  cancel-in-progress: ${{ inputs.mode != 'generate-traces' }}

permissions:
  contents: read

jobs:
  qualify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'qualify' }}
    name: Shared WASM source, model, package, and browser qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QUINT_VERSION: 0.32.0
      RUST_VERSION: 1.90.0
      PLAYWRIGHT_VERSION: 1.63.0
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Static workflow preflight
        run: scripts/verify-wasm-workflow.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Prepare cold package and tool state
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          node_version="$(node --version)"
          [[ "$node_version" == v26.* ]]
          cold_packages="$RUNNER_TEMP/wasm-nuget-packages"
          mkdir -p "$cold_packages"
          export NUGET_PACKAGES="$cold_packages"
          echo "NUGET_PACKAGES=$cold_packages" >> "$GITHUB_ENV"
          dotnet nuget locals http-cache --clear
          dotnet tool restore
          fable_version="$(dotnet tool run fable -- --version | sed -E $'s/\\x1B\\[[0-9;]*[mK]//g' | head -n 1)"
          test "$fable_version" = "5.18.0"

      - name: Install pinned Quint
        run: |
          npm install --global "@informalsystems/quint@${QUINT_VERSION}"
          test "$(quint --version)" = "$QUINT_VERSION"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc --version | grep -F "rustc ${RUST_VERSION} "
          rustup target list --installed | grep -Fx wasm32-unknown-unknown

      - name: Install pinned Playwright Chromium
        working-directory: tests/Wasm.Browser.Conformance
        run: |
          npm ci
          test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Prepare compatible supervisor qualification state
        run: |
          scripts/wasm-release/qualify-supervisor-custody.sh --bootstrap "$RUNNER_TEMP/wasm-supervisor-baseline"
          cat "$RUNNER_TEMP/wasm-supervisor-baseline/environment" >> "$GITHUB_ENV"

      - name: Rebuild pinned WebAssembly fixtures
        run: |
          tests/Wasm.Compatibility/modules/build-fixtures.sh
          git diff --exit-code -- tests/Wasm.Compatibility/modules

      - name: Verify compatibility contracts
        run: scripts/verify-wasm-contracts.sh

      - name: Verify lifecycle, packages, and Fable consumers
        env:
          QUINT: quint
          WASM_LIFECYCLE_EVIDENCE_DIR: ${{ runner.temp }}/wasm-lifecycle-evidence
        run: scripts/verify-wasm-lifecycle.sh

      - name: Run browser Worker conformance
        run: tests/Wasm.Browser.Conformance/run.sh

      - name: Verify SDK archive and fresh package consumer
        run: |
          scripts/wasm-release/prepare.sh artifacts/wasm-release
          scripts/verify-wasm-package-consumer.sh --custody artifacts/wasm-release

      - name: Qualify compatible supervisor source and installed custody
        run: |
          scripts/wasm-release/qualify-supervisor-custody.sh --custody artifacts/wasm-release "$RUNNER_TEMP/wasm-supervisor-evidence"

      - name: Retain bounded public lifecycle model evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-lifecycle-model-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wasm-lifecycle-evidence/qualification-status.json
            ${{ runner.temp }}/wasm-lifecycle-evidence/quint-sampled-init.txt
            ${{ runner.temp }}/wasm-lifecycle-evidence/quint-sampled-initReady.txt
            ${{ runner.temp }}/wasm-lifecycle-evidence/quint-sampled-init.itf.json
            ${{ runner.temp }}/wasm-lifecycle-evidence/quint-sampled-initReady.itf.json

  generate-traces:
    name: Prepare canonical WASM trace artifact (not qualification)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'generate-traces' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      QUINT_VERSION: 0.32.0
      WASM_TRACE_MODE: ${{ inputs.mode }}
      WASM_TRACE_EXPECTED_HEAD: ${{ inputs.expected-head }}
    steps:
      - name: Record original setup cutoff
        shell: bash
        run: printf 'WASM_TRACE_SETUP_DEADLINE=%s\n' "$(( $(date +%s) + 300 ))" >> "$GITHUB_ENV"

      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard dispatch and source before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$WASM_TRACE_MODE" = generate-traces
          [[ "$WASM_TRACE_EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$WASM_TRACE_EXPECTED_HEAD"
          test "$GITHUB_WORKFLOW_SHA" = "$WASM_TRACE_EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$WASM_TRACE_EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WASM_TRACE_OUTPUT_ROOT=%s/wasm-trace-preparation-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Static workflow preflight
        run: scripts/verify-wasm-workflow.sh

      - name: Set up Node for trace preparation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install exact trace tool
        timeout-minutes: 5
        run: npm install --global "@informalsystems/quint@${QUINT_VERSION}"

      - name: Prepare bounded canonical traces
        run: scripts/prepare-wasm-traces.sh

      - name: Retain trace preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-trace-preparation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wasm-trace-preparation-${{ github.run_id }}-${{ github.run_attempt }}/artifact/trace-preparation.zip
            ${{ runner.temp }}/wasm-trace-preparation-${{ github.run_id }}-${{ github.run_attempt }}/artifact/failure.json
            ${{ runner.temp }}/wasm-trace-preparation-${{ github.run_id }}-${{ github.run_attempt }}/artifact/failed-generation.log
