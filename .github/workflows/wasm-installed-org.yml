name: wasm-installed-org

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable published WASM version
        required: true
        type: string
      published_source:
        description: Exact immutable producer commit bound by release manifest
        required: true
        type: string
      qualifier_source:
        description: Exact immutable qualification commit selected by this dispatch
        required: true
        type: string
      accepted_executor:
        description: Root accepted current installed qualifier executor Q
        required: true
        type: string
      promotion_binding_sha256:
        description: Exact immutable published transaction binding SHA-256
        required: true
        type: string
      manifest_sha256:
        description: Root verified release manifest SHA-256
        required: true
        type: string
      sdk_sha256:
        description: Root verified SDK archive SHA-256
        required: true
        type: string

concurrency:
  group: wasm-installed-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        feed: [org, public]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISHED_SOURCE: ${{ inputs.published_source }}
      QUALIFIER_SOURCE: ${{ inputs.qualifier_source }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      NUGET_ACCOUNT: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      MODE: installed
      ACCEPTED_EXECUTOR: ${{ inputs.accepted_executor }}
      PROMOTION_BINDING_SHA256: ${{ inputs.promotion_binding_sha256 }}
      SDK_SHA256: ${{ inputs.sdk_sha256 }}
      WASM_PACKAGE_FEED: ${{ matrix.feed == 'org' && 'https://nuget.pkg.github.com/FS-GG/index.json' || 'https://api.nuget.org/v3/index.json' }}
      WASM_RELEASE_BASE_URL: https://github.com/FS-GG/FS.GG.Game/releases/download/wasm/v${{ inputs.version }}
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Static installed qualification preflight
        run: |
          python3 tests/release/wasm/test-consumer-source-mapping.py
          python3 tests/release/wasm/test-installed-org-workflow.py
          python3 tests/release/wasm/test-installed-evidence.py
      - name: Bind qualification source and immutable published receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wasm-release/bind-installed-release.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Install exact consumer tools
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.90.0
          scripts/wasm-release/install-browser-tools.sh
      - name: Qualify fresh installed consumer
        id: consumer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NuGetPackageSourceCredentials_wasm: ${{ matrix.feed == 'org' && format('Username=token;Password={0};ValidAuthenticationTypes=Basic', github.token) || '' }}
        run: |
          set -euo pipefail
          export NUGET_HTTP_CACHE_PATH="$RUNNER_TEMP/wasm-installed-${{ matrix.feed }}-http-cache"
          mkdir -p artifacts/wasm-installed-${{ matrix.feed }}
          export WASM_CONSUMER_EVIDENCE="$RUNNER_TEMP/consumer-${{ matrix.feed }}-evidence"
          export WASM_CONSUMER_STATUS="$GITHUB_WORKSPACE/artifacts/wasm-installed-${{ matrix.feed }}/consumer-status.json"
          phase=initial
          command_exit=null
          tee_exit=null
          record_runtime() {
            local original=$? recorded=0
            trap - EXIT
            set +e
            printf '{"phase":"%s","exitCode":%s,"commandExit":%s,"logExit":%s}\n' "$phase" "$original" "$command_exit" "$tee_exit" > artifacts/wasm-installed-${{ matrix.feed }}/runtime-status.json
            recorded=$?
            if (( original != 0 )); then exit "$original"; fi
            exit "$recorded"
          }
          trap record_runtime EXIT
          run_logged() {
            phase=$1
            local log=$2
            shift 2
            set +e
            "$@" 2>&1 | tee "$log"
            local results=("${PIPESTATUS[@]}")
            set -e
            command_exit=${results[0]}
            tee_exit=${results[1]}
            if (( command_exit != 0 )); then return "$command_exit"; fi
            return "$tee_exit"
          }
          run_logged consumer artifacts/wasm-installed-${{ matrix.feed }}/consumer.log scripts/verify-wasm-package-consumer.sh --feed-only
          run_logged selected artifacts/wasm-installed-${{ matrix.feed }}/selected.log scripts/wasm-release/qualify-supervisor-installed.sh --feed-only "$RUNNER_TEMP/selected-${{ matrix.feed }}"
          phase=complete
      - name: Collect bounded installed evidence
        if: always()
        env:
          RUNTIME_OUTCOME: ${{ steps.consumer.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          logs="artifacts/wasm-installed-${{ matrix.feed }}"
          mkdir -p "$logs"
          runtime=1
          [[ "$RUNTIME_OUTCOME" != success ]] || runtime=0
          if [[ ! -e "$logs/runtime-status.json" ]]; then
            printf '{"phase":"unreached","exitCode":null,"nativeOutcome":"%s"}\n' "$RUNTIME_OUTCOME" > "$logs/runtime-status.json"
          fi
          python3 scripts/wasm-release/installed-evidence.py assemble --work "$RUNNER_TEMP/selected-${{ matrix.feed }}" --consumer "$RUNNER_TEMP/consumer-${{ matrix.feed }}-evidence" --receipts "$RUNNER_TEMP/wasm-installed-receipts" --logs "$logs" --runtime "$runtime" --output "$RUNNER_TEMP/installed-${{ matrix.feed }}-evidence"
      - name: Retain installed qualification output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-installed-${{ matrix.feed }}-${{ github.sha }}-${{ inputs.version }}
          path: ${{ runner.temp }}/installed-${{ matrix.feed }}-evidence/
          if-no-files-found: error
          retention-days: 30
