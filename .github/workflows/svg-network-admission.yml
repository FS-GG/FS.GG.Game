name: svg-network-admission

on:
  pull_request:
    paths: ['src/Game.Core/NetworkSession.*', 'src/Game.Core/FS.GG.Game.Core.fsproj', 'src/Game.Core/Fable/FS.GG.Game.Core.fsproj', 'tests/Game.Core.Tests/NetworkSessionTests.fs', 'tests/Game.Core.Fable.Tests/**', 'readiness/svg-network-01-1/**', 'scripts/verify-svg-network-admission.sh', '.github/workflows/svg-network-admission.yml']
  push:
    branches: [main]
    paths: ['src/Game.Core/NetworkSession.*', 'src/Game.Core/FS.GG.Game.Core.fsproj', 'src/Game.Core/Fable/FS.GG.Game.Core.fsproj', 'tests/Game.Core.Tests/NetworkSessionTests.fs', 'tests/Game.Core.Fable.Tests/**', 'readiness/svg-network-01-1/**', 'scripts/verify-svg-network-admission.sh', '.github/workflows/svg-network-admission.yml']

permissions:
  contents: read

jobs:
  correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @informalsystems/quint@0.32.0
      - run: dotnet restore tests/Game.Core.Tests/Game.Core.Tests.fsproj --locked-mode
      - run: scripts/verify-svg-network-admission.sh
