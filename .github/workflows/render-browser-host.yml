name: render-browser-host

# GAME-RENDER-MULTI-01.4 (FS.GG.Game#730): the Fable-only browser host for the renderer-selection core.
# Packs FS.GG.Game.Render, checks its bounded Fable source view, compiles src/Render.Browser and
# tests/Render.Browser.Smoke with Fable, and runs every smoke check in headless Chrome, including the BabylonJS
# and PixiJS adapters on WebGL (software, through SwiftShader, on this runner) and switching between all three.
# The bindings are generated from the pinned FS.GG.Templates commit by scripts/materialize-js-bindings.sh.
# GAME-RENDER-ADOPT-01.2 (FS.GG.Game#746): the same job builds the rendering benchmark page (tests/Render.Browser.Bench)
# and runs one short software-control session (plain and interactive routes), so the harness cannot rot between fdev GPU
# runs, runs the driver's self-test of its GPU/software refusal, and validates that session and the committed baselines
# against the results schema. Its numbers are never compared or gated here.
# It also packs FS.GG.Game.Render.Browser, checks its Fable view, compiles a clean package consumer of the generated
# three-adapter module (FS.GG.Game#745), and fails on drift of the browser host's surface baseline, which the
# solution-only drift job in gate.yml cannot build.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-browser-host.yml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "src/Game.Render/**"
      - "src/Render.Browser/**"
      - "src/Render.Browser.Bindings/**"
      - "tests/Render.Browser.Smoke/**"
      - "tests/Game.Render.Pipeline.Laws/**"
      - "scripts/test-pipeline-laws.sh"
      - "tests/Game.Render.Theme.Determinism/**"
      - "scripts/test-theme-determinism.sh"
      - "tests/Game.Render.Themes.Fuzz/**"
      - "scripts/test-theme-fuzz.sh"
      - "src/ReferenceGame/State.fs"
      - "src/ReferenceGame/Renderers.fs"
      - "eng/render-kit/**"
      - "scripts/new-game-renderers.sh"
      - "scripts/test-render-browser-host.sh"
      - "scripts/materialize-js-bindings.sh"
      - "eng/js-bindings/**"
      - "src/ReferenceGame/**"
      - "tests/Render.Browser.Bench/**"
      - "tools/render-bench/**"
      - "scripts/render-bench.sh"
      - "src/Game.Core/**"
      - "tests/release/test-render-browser-package-consumer.sh"
      - "tests/release/check-fable-views.py"
      - "scripts/refresh-surface-baselines.fsx"
      - "readiness/surface-baselines/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/render-browser-host.yml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "src/Game.Render/**"
      - "src/Render.Browser/**"
      - "src/Render.Browser.Bindings/**"
      - "tests/Render.Browser.Smoke/**"
      - "tests/Game.Render.Pipeline.Laws/**"
      - "scripts/test-pipeline-laws.sh"
      - "tests/Game.Render.Theme.Determinism/**"
      - "scripts/test-theme-determinism.sh"
      - "tests/Game.Render.Themes.Fuzz/**"
      - "scripts/test-theme-fuzz.sh"
      - "src/ReferenceGame/State.fs"
      - "src/ReferenceGame/Renderers.fs"
      - "eng/render-kit/**"
      - "scripts/new-game-renderers.sh"
      - "scripts/test-render-browser-host.sh"
      - "scripts/materialize-js-bindings.sh"
      - "eng/js-bindings/**"
      - "src/ReferenceGame/**"
      - "tests/Render.Browser.Bench/**"
      - "tools/render-bench/**"
      - "scripts/render-bench.sh"
      - "src/Game.Core/**"
      - "tests/release/test-render-browser-package-consumer.sh"
      - "tests/release/check-fable-views.py"
      - "scripts/refresh-surface-baselines.fsx"
      - "readiness/surface-baselines/**"
  workflow_dispatch:

concurrency:
  group: render-browser-host-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-host:
    name: Renderer host browser smoke (SVG, Pixi and Babylon through Fable)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Pack the Fable view, compile the host and run the browser smoke
        run: scripts/test-render-browser-host.sh

      - name: Input pipeline laws on .NET and Fable (byte-identical output, ADR 0001)
        run: scripts/test-pipeline-laws.sh

      - name: Theme colour derivation on .NET and Fable (byte-identical and equal to expected.txt, ADR GAME-RENDER-02.4 D11)
        run: scripts/test-theme-determinism.sh

      - name: Theme derivation fuzz, custom seeds included, on .NET and Fable (byte-identical; FS.GG.Game#795, glyph ADR Q12)
        run: scripts/test-theme-fuzz.sh

      - name: Benchmark driver self-test (GPU/software refusal, flags and option handling; no browser)
        run: node tools/render-bench/driver.mjs selftest

      - name: Build the benchmark page, run a short software-control session in both routes and validate the results
        run: |
          set -euo pipefail
          scripts/render-bench.sh -- --mode software --scenes room-tiles,room-swarm --sizes 100 \
            --interaction plain,interactive --repeats 1 --frames 30 --warmup 5 --out "$RUNNER_TEMP/render-bench.json"
          node tools/render-bench/driver.mjs validate "$RUNNER_TEMP/render-bench.json" tools/render-bench/baselines/*.json

      - name: Browser host surface baseline drift (readiness/surface-baselines/FS.GG.Game.Render.Browser)
        run: |
          dotnet build src/Render.Browser/FS.GG.Game.Render.Browser.fsproj -c Debug
          dotnet fsi scripts/refresh-surface-baselines.fsx --browser
          if ! git diff --exit-code -- readiness/surface-baselines; then
            echo "::error::the browser host's public surface changed but its baseline was not updated. Run scripts/materialize-js-bindings.sh all, dotnet build src/Render.Browser -c Debug, then dotnet fsi scripts/refresh-surface-baselines.fsx --browser, and commit the result."
            exit 1
          fi

  # ADR GAME-RENDER-02.4 D11 (FS.GG.Game#789): the third runtime of the hex check. The browser-host job compares .NET on
  # Linux and node (through Fable) with tests/Game.Render.Theme.Determinism/expected.txt; this job compares .NET on
  # Windows with the same file.
  theme-determinism-windows:
    name: Theme colour derivation on .NET (Windows), equal to expected.txt
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: false

      - name: Derive on .NET (Windows) and compare with expected.txt
        shell: bash
        run: scripts/test-theme-determinism.sh --dotnet-only
