name: release

# Release-only publish for FS.GG.Game (ADR-0022 / P5). Tag-triggered; NEVER a required check and
# NEVER on push/PR (mirrors the sibling repos' release cadence). Publishes the coherent set
# FS.GG.Game.Core + FS.GG.Game.Render + FS.GG.Game.Harness + FS.GG.Game.Physics.Box2D to the org GitHub Packages feed
# (nuget.pkg.github.com/FS-GG), then dual-publishes the BYTE-IDENTICAL set to public nuget.org via
# Trusted Publishing / OIDC (ADR-0012 §1–§5 / ADR-0013 — no stored key). Gated on a full headless
# build+test first: a set is published only after `verify` is green (publish-before-flip, FR-007).
#
# The set shares ONE version (the repo-wide <Version> in Directory.Build.local.props); the packages
# move together, so every release re-publishes all four at the same version. Game.Render depends on
# Game.Core@same-version + FS.GG.UI.Scene (itself dual-published, ADR-0012/0013); Game.Harness
# depends on Game.Core@same-version + the BCL only (WI-6, Game#425). FS.GG.Game.Harness joined the
# set at 0.6.0 — it is packable and in the slnx as of #423 but landed after the v0.5.1 release, so no
# published version predates 0.6.0 for it.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack+publish (e.g. 0.1.0-preview.1). Required to actually push on a manual run; omit for a pack-only dry run."
        type: string
        required: false
      admission_only:
        description: "Check registry collisions and OIDC authentication without packing or publishing; package creation scope is not exposed by NuGet. Ignores version-tag checkout."
        type: boolean
        default: false
      source_run_id:
        description: "Failed tag release run whose retained package artifact must be resumed."
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release-only gate: re-run the deterministic headless build+test at the tagged commit (gate.yml
  # runs on push/PR to main, not on tags). publish-packages `needs:` this — a red suite SKIPS the
  # push, which is the safety net, not a nuisance.
  verify:
    name: Verify (locked restore + headless build + test)
    runs-on: ubuntu-latest
    # Restrict to the canonical repo: fork tags/dispatch never run this (no fork secret exposure).
    if: github.repository == 'FS-GG/FS.GG.Game' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_dispatch' || inputs.admission_only != true)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # Cheap exact-roster/version/order checks run before restore or the full release suite.
      - name: Preflight 0.17.0 release contract and mutation controls
        shell: bash
        run: |
          tests/release/test-game-0-17-release.sh --source-only
          tests/release/test-game-0-17-release-selftest.sh
          python3 tests/release/test-release-admission.py

      # COLD, via the shared action (#135 / FS-GG/.github#429) — and this is the job where a warm
      # restore was worst. There is no `cache: true` here to blame: --locked-mode validates the
      # committed contentHash against whatever copy of the package is already in the global-packages
      # folder, and on a GitHub runner that folder is PRE-SEEDED BY THE IMAGE. So this restore never
      # had to contact the feed either, and `publish-packages` needs: this job — meaning the one gate
      # standing between a lock file no fresh clone can restore and a PUBLISHED, dual-published,
      # immutable package was comparing a record against a record.
      - name: Restore (locked, cold)
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Game.slnx

      - name: Build (net10.0, Debug)
        run: dotnet build FS.GG.Game.slnx -c Debug --no-restore
      - name: Test (full headless suite)
        run: dotnet test FS.GG.Game.slnx -c Debug --no-restore

  publish-packages:
    name: Publish FS.GG.Game.* (org feed + nuget.org, release-only)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.Game' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_dispatch' || inputs.admission_only != true)
    needs: [verify]
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write   # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from the release tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            release)           raw="${{ github.event.release.tag_name }}" ;;
            push)              raw="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) raw="${{ inputs.version }}" ;;
            *)                 raw="" ;;
          esac
          ver="${raw#v}"   # v0.1.0-preview.1 -> 0.1.0-preview.1
          if [[ -z "$ver" ]]; then
            echo "::notice::No version (manual run without input) — pack-only dry run, no push."
            echo "push=false" >> "$GITHUB_OUTPUT"
            ver="0.0.0-dryrun.${GITHUB_RUN_ID}"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Release version: $ver"

      # The tag is the release trigger; Directory.Build.local.props <Version> is the version-of-truth
      # the packages actually carry. They MUST agree, else the tag advertises a version the packed
      # bytes don't match. Fail loud on a mismatch (bump the props in the same release PR).
      - name: Guard — tag version == repo version-of-truth
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          truth="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.local.props)"
          [[ -n "$truth" ]] || { echo "::error::<Version> not found in Directory.Build.local.props"; exit 1; }
          if [[ "$truth" != "$VER" ]]; then
            echo "::error::tag version ($VER) != Directory.Build.local.props <Version> ($truth). Bump the version-of-truth to match the tag in the release PR."
            exit 1
          fi
          echo "Version-of-truth matches the tag: $VER"

      # The BYTES THAT GET PUBLISHED are restored here, so this restore is cold too. It carried no
      # --locked-mode flag, which made it look like a plain build prerequisite; it was not. The
      # org-shared Directory.Build.props sets RestoreLockedMode for EVERY restore in CI
      # (GITHUB_ACTIONS=true + a lockfile exists), so this was a locked restore against the image's
      # pre-seeded package folder, exactly like the one in `verify` — just harder to see, because the
      # flag that would have told you was implicit.
      - name: Restore (locked, cold)
        if: inputs.source_run_id == ''
        uses: ./.github/actions/locked-restore
        with:
          target: FS.GG.Game.slnx

      # Pack the coherent set. FS.GG.Game.Core, FS.GG.Game.Render, FS.GG.Game.Harness and FS.GG.Game.Physics.Box2D are
      # IsPackable=true (all test and example projects are IsPackable=false), so packing the whole slnx
      # yields exactly those four packages, all at $VER — and each ProjectReference to Game.Core
      # (Render's and Harness's) is emitted as a package dependency at the same $VER (coherent set).
      #
      # `dotnet pack` restores implicitly, and that is left alone deliberately: it re-resolves with
      # -p:Version set, which is how the packed nuspec gets the right dependency version. It now
      # resolves into the COLD NUGET_PACKAGES the step above exported to GITHUB_ENV, so it validates
      # against the same feed-backed folder rather than the image's.
      - name: Pack FS.GG.Game.* (coherent set @ $VER)
        if: inputs.source_run_id == ''
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack FS.GG.Game.slnx -c Release \
            -p:Version="$VER" \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:EnablePackageValidation=true \
            -o artifacts/packages
          (cd artifacts/packages && sha256sum -- *.nupkg | sort -k2 > SHA256SUMS)
          echo "Packed:"; ls -1 artifacts/packages/*.nupkg

      - name: Authenticate failed release custody
        if: inputs.source_run_id != ''
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id must be numeric"; exit 1; }
          source_head="$(git rev-parse HEAD)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg head "$source_head" --arg branch "v$VER" \
            '.event == "push" and .head_branch == $branch and .head_sha == $head and .status == "completed" and .conclusion == "failure" and .path == ".github/workflows/release.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "::error::run $SOURCE_RUN_ID is not the failed release for immutable tag v$VER at $source_head"
              exit 1
            }
          artifact="game-release-custody-$source_head-$VER"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "$artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false and ((.digest // "") | test("^sha256:[0-9a-f]{64}$")))] | length == 1' \
            <<<"$artifacts_json" >/dev/null || {
              echo "::error::run $SOURCE_RUN_ID has no unique retained artifact $artifact"
              exit 1
            }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Download retained release bytes
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.recovery.outputs.artifact }}
          path: artifacts/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify coherent release custody
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts/packages && sha256sum --check SHA256SUMS)
          count="$(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l)"
          [ "$count" = 4 ] || { echo "::error::release custody must contain exactly four primary packages; found $count"; exit 1; }

      - name: Verify coherent package set, metadata, and clean Journey consumer
        shell: bash
        run: tests/release/test-game-0-17-release.sh --packages artifacts/packages

      - name: Qualify package-only Box2D candidate from retained preparation
        shell: bash
        run: tests/release/test-box2d-package-consumer.sh --packages artifacts/packages

      - name: Retain original coherent package bytes before publication
        if: inputs.source_run_id == ''
        uses: actions/upload-artifact@v7
        with:
          name: game-release-custody-${{ github.sha }}-${{ steps.ver.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Push coherent set to nuget.pkg.github.com/FS-GG
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --no-symbols \
            --skip-duplicate
          echo "Published FS.GG.Game.* ${{ steps.ver.outputs.version }} to the org feed."

      # Dual-publish the BYTE-IDENTICAL set to public nuget.org (ADR-0012 §1–§5) via Trusted Publishing
      # / OIDC (ADR-0013 — no stored key). Runs AFTER the org-feed push (gated ordering, ADR-0012 §4):
      # if that step fails the job stops before this one. NuGet/login mints a single-use key from the
      # org's Trusted Publishing policy for THIS repo (Repository FS.GG.Game, Workflow File release.yml);
      # until that policy exists it 401s and fails the release loud. Same artifacts — no re-pack (§3).
      - name: NuGet login (OIDC → short-lived nuget.org key)
        if: steps.ver.outputs.push == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Push coherent set to nuget.org (public)
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --no-symbols \
            --skip-duplicate
          echo "Published FS.GG.Game.* ${{ steps.ver.outputs.version }} to nuget.org."

      - name: Read back and compare both feed payloads
        if: steps.ver.outputs.push == 'true'
        shell: bash
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readback/github artifacts/readback/nuget
          for package in artifacts/packages/*.nupkg; do
            file="$(basename "$package")"; id="${file%."$VER".nupkg}"; lower="${id,,}"
            for feed in github nuget; do
              url="https://nuget.pkg.github.com/FS-GG/download/$lower/$VER/$lower.$VER.nupkg"
              auth=(--user "fs-gg:$FEED_TOKEN")
              if [ "$feed" = nuget ]; then
                url="https://api.nuget.org/v3-flatcontainer/$lower/$VER/$lower.$VER.nupkg"; auth=()
              fi
              for attempt in {1..60}; do
                if curl --fail --location --silent --show-error "${auth[@]}" "$url" --output "artifacts/readback/$feed/$file"; then break; fi
                [ "$attempt" != 60 ] || exit 4
                echo "Waiting for $feed readback of $id $VER ($attempt/60)"; sleep 10
              done
            done
          done
          python3 - artifacts/packages artifacts/readback artifacts/readback.json <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys
          from zipfile import ZipFile
          originals, readbacks, report = map(Path, sys.argv[1:])
          def payload(path):
              with ZipFile(path) as archive:
                  return {name: sha256(archive.read(name)).hexdigest()
                          for name in archive.namelist() if name != '.signature.p7s'}
          rows=[]
          for original in sorted(originals.glob('*.nupkg')):
              expected=payload(original); row={'file':original.name,'originalSha256':sha256(original.read_bytes()).hexdigest(),'feeds':{}}
              for feed in ('github','nuget'):
                  remote=readbacks/feed/original.name; observed=payload(remote)
                  if observed != expected: raise SystemExit(f'{feed} payload differs for {original.name}')
                  row['feeds'][feed]={'archiveSha256':sha256(remote.read_bytes()).hexdigest(),'payloadMembers':len(observed),'payloadMatch':True}
              rows.append(row)
          if len(rows) != 4: raise SystemExit(f'expected four primary package readbacks, got {len(rows)}')
          report.write_text(json.dumps({'schema':'fsgg.game.release-readback/v1','packages':rows},indent=2)+'\n')
          PY

      - name: Qualify fresh public package-only Box2D consumer
        if: steps.ver.outputs.push == 'true'
        shell: bash
        run: tests/release/test-box2d-package-consumer.sh --public

      - name: Retain dual-feed readback evidence
        if: steps.ver.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: game-release-readback-${{ steps.ver.outputs.version }}-${{ github.run_id }}
          path: artifacts/readback.json
          if-no-files-found: error
          retention-days: 90

  admission:
    name: Observe registry and OIDC admission (no publication)
    if: github.repository == 'FS-GG/FS.GG.Game' && github.event_name == 'workflow_dispatch' && inputs.admission_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write # Match the publisher principal; this job makes only registry GET requests.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard isolated observation mode
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test -z "$SOURCE_RUN_ID"
          python3 tests/release/test-release-admission.py
      - name: Read both registries with the actual repository token
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/release/observe-release-admission.py --registries artifacts/admission/registries.json
      - name: Exchange workflow identity (no package push)
        id: admission-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Verify predecessor package authority without publication
        env:
          NUGET_API_KEY: ${{ steps.admission-login.outputs.NUGET_API_KEY }}
        run: python3 tests/release/observe-release-admission.py --authority artifacts/admission/authority.json
      - name: Retain sanitized observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-release-admission-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/admission/*.json
          if-no-files-found: warn
          retention-days: 30
